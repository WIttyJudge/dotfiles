[general]
import = ["~/.config/alacritty/themes/catppuccin-mocha.toml"]

[bell]
animation = "EaseOutExpo"

[cursor]
style = "Underline"
vi_mode_style = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 15.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Medium"

[[keyboard.bindings]]
action = "Paste"
key = "P"
mods = "Control"

[[keyboard.bindings]]
action = "Paste"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
chars = "gc"
key = "Slash"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "C"
mode = "Vi"
mods = "Control"

[[keyboard.bindings]]
action = "Last"
key = "Key4"
mode = "Vi"

[[mouse.bindings]]
action = "Copy"
mouse = "Middle"

[scrolling]
multiplier = 1

[window]
opacity = 0.9
# Option is not registered by default in Mac OS.
option_as_alt = "Both"

[window.padding]
x = 0
y = 0
